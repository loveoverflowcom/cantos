    "release-report": {
      "machine": {
        "image": "ubuntu-2404:current"
      },
      "resource_class": "medium",
      "environment": {
        "CANTOS_PIPELINE_ID": "<< pipeline.id >>",
        "CANTOS_PIPELINE_NUMBER": "<< pipeline.number >>",
        "CANTOS_CONFIG_SHA": "<< pipeline.config.sha >>",
        "CANTOS_CONFIG_REPOSITORY": "<< pipeline.config.repository.url >>",
        "CANTOS_CONFIG_REF": "<< pipeline.config.ref >>"
      },
      "steps": [
        "checkout",
        "install-build-rust",
        {
          "attach_workspace": {
            "at": "."
          }
        },
        {
          "run": {
            "name": "Report selected components independently, including partial releases",
            "command": "cargo xtask release report --transfer artifacts/release-transfer"
          }
        },
        {
          "store_artifacts": {
            "path": "artifacts/release-transfer"
          }
        }
      ]
    },
    "package-web-release": {
      "machine": {
        "image": "ubuntu-2404:current"
      },
      "resource_class": "medium",
      "environment": {
        "CANTOS_PIPELINE_ID": "<< pipeline.id >>",
        "CANTOS_PIPELINE_NUMBER": "<< pipeline.number >>",
        "CANTOS_CONFIG_SHA": "<< pipeline.config.sha >>",
        "CANTOS_CONFIG_REPOSITORY": "<< pipeline.config.repository.url >>",
        "CANTOS_CONFIG_REF": "<< pipeline.config.ref >>"
      },
      "parameters": {
        "app": {
          "type": "enum",
          "enum": [
            "theatre-web",
            "studio-web"
          ]
        }
      },
      "steps": [
        "checkout",
        "install-build-rust",
        "build-cache-restore",
        "install-build-trunk",
        {
          "run": {
            "name": "Resolve once; affected gates; build immutable artifacts",
            "environment": {
              "RELEASE_COMPONENT": "<< parameters.app >>",
              "RELEASE_TARGET": "<< pipeline.parameters.target >>",
              "RELEASE_API_ORIGIN": "<< pipeline.parameters.api-origin >>",
              "BUILD_ONLY": "false"
            },
            "no_output_timeout": "30m",
            "command": "set -Eeuo pipefail\nargs=(--component \"$RELEASE_COMPONENT\" --api-origin \"$RELEASE_API_ORIGIN\" --transfer artifacts/cloudflare-transfer/<< parameters.app >>)\nif [[ \"$BUILD_ONLY\" == true ]]; then args+=(--build-only); fi\nif [[ -n \"$RELEASE_TARGET\" ]]; then args+=(--target \"$RELEASE_TARGET\"); fi\ncargo xtask release prepare \"${args[@]}\"\n"
          }
        },
        "build-cache-save",
        {
          "persist_to_workspace": {
            "root": ".",
            "paths": [
              "artifacts/cloudflare-transfer/<< parameters.app >>"
            ]
          }
        },
        {
          "store_artifacts": {
            "path": "artifacts/cloudflare-transfer/<< parameters.app >>"
          }
        }
      ]
    },
    "deploy-web-cloudflare": {
      "parameters": {
        "app": {
          "type": "enum",
          "enum": [
            "cantos-theatre",
            "cantos-studio"
          ]
        },
        "component": {
          "type": "enum",
          "enum": [
            "theatre-web",
            "studio-web"
          ]
        }
      },
      "docker": [
        {
          "image": "cimg/rust:1.98.1-node"
        }
      ],
      "resource_class": "large",
      "steps": [
        "checkout",
        {
          "attach_workspace": {
            "at": "."
          }
        },
        {
          "require-env": {
            "names": "CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_THEATRE_PROJECT CLOUDFLARE_STUDIO_PROJECT CLOUDFLARE_PRODUCTION_BRANCH"
          }
        },
        {
          "run": {
            "name": "Validate v2 workspace provenance and checkout its resolved source",
            "command": "cargo xtask release checkout --transfer artifacts/cloudflare-transfer/<< parameters.component >>"
          }
        },
        {
          "run": {
            "name": "Require a Node.js supported by the pinned Wrangler",
            "command": "set -Eeuo pipefail\nmajor=\"$(node --version | sed -E 's/^v([0-9]+).*/\\1/')\"\n[[ \"$major\" -ge 22 ]] || { echo \"Node.js 22 or newer is required.\" >&2; exit 1; }\n"
          }
        },
        {
          "run": {
            "name": "Install the pinned Wrangler from the lockfile (no implicit download, no global install)",
            "command": "env -u CLOUDFLARE_API_TOKEN npm ci --ignore-scripts --prefix infra/cloudflare/wrangler"
          }
        },
        {
          "run": {
            "name": "Bind exact source and Pages destination before publishing",
            "environment": {
              "WEB_ENVIRONMENT": "<< pipeline.parameters.web-environment >>",
              "WEB_BRANCH": "<< pipeline.parameters.web-branch >>"
            },
            "command": "cargo xtask release pages-intent --transfer artifacts/cloudflare-transfer/<< parameters.component >> --component << parameters.component >>"
          }
        },
        {
          "persist_to_workspace": {
            "root": ".",
            "paths": [
              "artifacts/cloudflare-transfer/<< parameters.component >>/intents/<< parameters.component >>"
            ]
          }
        },
        {
          "run": {
            "name": "Publish once using the persisted Pages intent",
            "no_output_timeout": "30m",
            "command": "cargo xtask release pages-promote --transfer artifacts/cloudflare-transfer/<< parameters.component >> --component << parameters.component >>",
            "teardown": [
              {
                "run": {
                  "name": "Keep run-owned outcome paths after failure or cancellation",
                  "command": "mkdir -p artifacts/cloudflare-transfer/<< parameters.component >>/outcomes/<< parameters.component >> artifacts/cloudflare"
                }
              },
              {
                "persist_to_workspace": {
                  "root": ".",
                  "paths": [
                    "artifacts/cloudflare-transfer/<< parameters.component >>/outcomes/<< parameters.component >>"
                  ]
                }
              },
              {
                "store_artifacts": {
                  "path": "artifacts/cloudflare-transfer/<< parameters.component >>/outcomes",
                  "destination": "pages-outcomes"
                }
              },
              {
                "store_artifacts": {
                  "path": "artifacts/cloudflare",
                  "destination": "pages-run-records"
                }
              }
            ]
          }
        }
      ],
      "environment": {
        "CANTOS_PIPELINE_ID": "<< pipeline.id >>",
        "CANTOS_PIPELINE_NUMBER": "<< pipeline.number >>",
        "CANTOS_CONFIG_SHA": "<< pipeline.config.sha >>",
        "CANTOS_CONFIG_REPOSITORY": "<< pipeline.config.repository.url >>",
        "CANTOS_CONFIG_REF": "<< pipeline.config.ref >>"
      }
    },
    "reject-retired-release": {
      "docker": [
        {
          "image": "cimg/base:stable"
        }
      ],
      "steps": [
        {
          "run": {
            "name": "Refuse retired legacy API/aggregate release",
            "command": "echo \"Legacy api/all release is retired. Select an explicit Web component; native images use cargo xtask release oci-build. No VPS activation is available.\" >&2\nexit 1\n"
          }
        }
      ]
    }
  },
  "workflows": {
    "invalid-request": {
      "when": {
        "and": [
          "<< pipeline.parameters.build >>",
          "<< pipeline.parameters.target >>"
        ]
      },
      "jobs": [
        "reject-conflicting-request"
      ]
    },
    "release-api": {
      "when": {
        "and": [
          {
            "not": "<< pipeline.parameters.build >>"
          },
          "<< pipeline.parameters.target >>",
          {
            "or": [
              {
                "equal": [
                  "api",
                  "<< pipeline.parameters.component >>"
                ]
              },
              {
                "and": [
                  {
                    "equal": [
                      "all",
                      "<< pipeline.parameters.component >>"
                    ]
                  },
                  {
                    "equal": [
                      "cloudflare",
                      "<< pipeline.parameters.web-provider >>"
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      "jobs": [
        "reject-retired-release"
      ]
    },
    "release-theatre-web": {
      "when": {
        "and": [
          {
            "not": "<< pipeline.parameters.build >>"
          },
          "<< pipeline.parameters.target >>",
          {
            "equal": [
              "theatre-web",
              "<< pipeline.parameters.component >>"
            ]
          },
          {
            "equal": [
              "firebase",
              "<< pipeline.parameters.web-provider >>"
            ]
          }
        ]
      },
      "jobs": [
        {
          "prepare-release": {
            "component": "theatre-web"
          }
        },
        {
          "approve-production": {
            "type": "approval",
            "requires": [
              "prepare-release"
            ]
          }
        },
        {
          "deploy-theatre-web": {
            "requires": [
              "approve-production"
            ],
            "context": [
              "production-web"
            ],
            "serial-group": "<< pipeline.project.slug >>/production-theatre-web",
            "filters": "pipeline.git.branch == \"develop\" and (pipeline.git.repo_url == \"https://github.com/loveoverflowcom/cantos\" or pipeline.git.repo_url == \"https://github.com/loveoverflowcom/cantos.git\") and pipeline.config.ref == \"refs/heads/develop\" and (pipeline.config.repository.url == \"https://github.com/loveoverflowcom/cantos\" or pipeline.config.repository.url == \"https://github.com/loveoverflowcom/cantos.git\")"
          }
        },
        {
          "release-report": {
            "requires": [
              {
                "deploy-theatre-web": "terminal"
              }
            ]
          }
        }
      ]
    },
    "release-studio-web": {
      "when": {
        "and": [
          {
            "not": "<< pipeline.parameters.build >>"
          },
          "<< pipeline.parameters.target >>",
          {
            "equal": [
              "studio-web",
              "<< pipeline.parameters.component >>"
            ]
          },
          {
            "equal": [
              "firebase",
              "<< pipeline.parameters.web-provider >>"
            ]
          }
        ]
      },
      "jobs": [
        {
          "prepare-release": {
            "component": "studio-web"
          }
        },
        {
          "approve-production": {
            "type": "approval",
            "requires": [
              "prepare-release"
            ]
          }
        },
        {
          "deploy-studio-web": {
            "requires": [
              "approve-production"
            ],
            "context": [
              "production-web"
            ],
            "serial-group": "<< pipeline.project.slug >>/production-studio-web",
            "filters": "pipeline.git.branch == \"develop\" and (pipeline.git.repo_url == \"https://github.com/loveoverflowcom/cantos\" or pipeline.git.repo_url == \"https://github.com/loveoverflowcom/cantos.git\") and pipeline.config.ref == \"refs/heads/develop\" and (pipeline.config.repository.url == \"https://github.com/loveoverflowcom/cantos\" or pipeline.config.repository.url == \"https://github.com/loveoverflowcom/cantos.git\")"
          }
        },
        {
          "release-report": {
            "requires": [
              {
                "deploy-studio-web": "terminal"
              }
            ]
          }
        }
      ]
    },
    "release-web": {
      "when": {
        "and": [
          {
            "not": "<< pipeline.parameters.build >>"
          },
          "<< pipeline.parameters.target >>",
          {
            "equal": [
              "web",
              "<< pipeline.parameters.component >>"
            ]
          },
          {
            "equal": [
              "firebase",
              "<< pipeline.parameters.web-provider >>"
            ]
          }
        ]
      },
      "jobs": [
        {
          "prepare-release": {
            "component": "web"
          }
        },
        {
          "approve-production": {
            "type": "approval",
            "requires": [
              "prepare-release"
            ]
          }
        },
        {
          "deploy-theatre-web": {
            "requires": [
              "approve-production"
            ],
            "context": [
              "production-web"
            ],
            "serial-group": "<< pipeline.project.slug >>/production-theatre-web",
            "filters": "pipeline.git.branch == \"develop\" and (pipeline.git.repo_url == \"https://github.com/loveoverflowcom/cantos\" or pipeline.git.repo_url == \"https://github.com/loveoverflowcom/cantos.git\") and pipeline.config.ref == \"refs/heads/develop\" and (pipeline.config.repository.url == \"https://github.com/loveoverflowcom/cantos\" or pipeline.config.repository.url == \"https://github.com/loveoverflowcom/cantos.git\")"
          }
        },
        {
          "deploy-studio-web": {
            "requires": [
              "deploy-theatre-web"
            ],
            "context": [
              "production-web"
            ],
            "serial-group": "<< pipeline.project.slug >>/production-studio-web",
            "filters": "pipeline.git.branch == \"develop\" and (pipeline.git.repo_url == \"https://github.com/loveoverflowcom/cantos\" or pipeline.git.repo_url == \"https://github.com/loveoverflowcom/cantos.git\") and pipeline.config.ref == \"refs/heads/develop\" and (pipeline.config.repository.url == \"https://github.com/loveoverflowcom/cantos\" or pipeline.config.repository.url == \"https://github.com/loveoverflowcom/cantos.git\")"
          }
        },
        {
          "release-report": {
            "requires": [
              {
                "deploy-theatre-web": "terminal"
              },
              {
                "deploy-studio-web": "terminal"
              }
            ]
          }
        }
      ]
    },
    "release-all": {
      "when": {
        "and": [
          {
            "not": "<< pipeline.parameters.build >>"
          },
          "<< pipeline.parameters.target >>",
          {
            "equal": [
              "all",
              "<< pipeline.parameters.component >>"
            ]
          },
          {
            "equal": [
              "firebase",
              "<< pipeline.parameters.web-provider >>"
            ]
          }
        ]
      },
      "jobs": [
        "reject-retired-release"
      ]
    },
    "build-api": {
      "when": {
        "and": [
          "<< pipeline.parameters.build >>",
          {
            "not": "<< pipeline.parameters.target >>"
          },
          {
            "equal": [
              "api",
              "<< pipeline.parameters.build-component >>"
            ]
          }
        ]
      },
      "jobs": [
        "reject-retired-release"
      ]
    },
    "build-theatre-web": {
      "when": {
        "and": [
          "<< pipeline.parameters.build >>",
          {
            "not": "<< pipeline.parameters.target >>"
          },
          {
            "equal": [
              "theatre-web",
              "<< pipeline.parameters.build-component >>"
            ]
          }
        ]
      },
      "jobs": [
        {
          "prepare-release": {
            "component": "theatre-web",
            "build-only": true,
            "android": false
          }
        }
      ]
    },
    "build-studio-web": {
      "when": {
        "and": [
          "<< pipeline.parameters.build >>",
          {
            "not": "<< pipeline.parameters.target >>"
          },
          {
            "equal": [
              "studio-web",
              "<< pipeline.parameters.build-component >>"
            ]
          }
        ]
      },
      "jobs": [
        {
          "prepare-release": {
            "component": "studio-web",
            "build-only": true,
            "android": false
          }
        }
      ]
    },
    "build-android": {
      "when": {
        "and": [
          "<< pipeline.parameters.build >>",
          {
            "not": "<< pipeline.parameters.target >>"
          },
          {
            "equal": [
              "android",
              "<< pipeline.parameters.build-component >>"
            ]
          }
        ]
      },
      "jobs": [
        {
          "prepare-android": {
            "component": "android",
            "build-only": true,
            "android": true
          }
        }
      ]
    },
    "build-all": {
      "when": {
        "and": [
          "<< pipeline.parameters.build >>",
          {
            "not": "<< pipeline.parameters.target >>"
          },
          {
            "equal": [
              "all",
              "<< pipeline.parameters.build-component >>"
            ]
          }
        ]
      },
      "jobs": [
        "reject-retired-release"
      ]
    },
    "release-cloudflare-theatre-web": {
      "when": {
        "and": [
          {
            "not": "<< pipeline.parameters.build >>"
          },
          "<< pipeline.parameters.target >>",
          {
            "equal": [
              "cloudflare",
              "<< pipeline.parameters.web-provider >>"
            ]
          },
          {
            "or": [
              {
                "equal": [
                  "theatre-web",
                  "<< pipeline.parameters.component >>"
                ]
              },
              {
                "equal": [
                  "web",
                  "<< pipeline.parameters.component >>"
                ]
              }
            ]
          }
        ]
      },
      "jobs": [
        {
          "package-web-release": {
            "name": "package-theatre-web",
            "app": "theatre-web"
          }
        },
        {
          "approve-cloudflare-theatre-web": {
            "type": "approval",
            "requires": [
              "package-theatre-web"
            ]
          }
        },
        {
          "deploy-web-cloudflare": {
            "name": "deploy-cloudflare-theatre-web",
            "app": "cantos-theatre",
            "component": "theatre-web",
            "requires": [
              "approve-cloudflare-theatre-web"
            ],
            "context": [
              "cloudflare-web"
            ],
            "serial-group": "<< pipeline.project.slug >>/cloudflare-theatre-web",
            "filters": "pipeline.git.branch == \"develop\" and (pipeline.git.repo_url == \"https://github.com/loveoverflowcom/cantos\" or pipeline.git.repo_url == \"https://github.com/loveoverflowcom/cantos.git\") and pipeline.config.ref == \"refs/heads/develop\" and (pipeline.config.repository.url == \"https://github.com/loveoverflowcom/cantos\" or pipeline.config.repository.url == \"https://github.com/loveoverflowcom/cantos.git\")"
          }
        }
      ]
    },
    "release-cloudflare-studio-web": {
      "when": {
        "and": [
          {
            "not": "<< pipeline.parameters.build >>"
          },
          "<< pipeline.parameters.target >>",
          {
            "equal": [
              "cloudflare",
              "<< pipeline.parameters.web-provider >>"
            ]
          },
          {
            "or": [
              {
                "equal": [
                  "studio-web",
                  "<< pipeline.parameters.component >>"
                ]
              },
              {
                "equal": [
                  "web",
                  "<< pipeline.parameters.component >>"
                ]
              }
            ]
          }
        ]
      },
      "jobs": [
        {
          "package-web-release": {
            "name": "package-studio-web",
            "app": "studio-web"
          }
        },
        {
          "approve-cloudflare-studio-web": {
            "type": "approval",
            "requires": [
              "package-studio-web"
            ]
          }
        },
        {
          "deploy-web-cloudflare": {
            "name": "deploy-cloudflare-studio-web",
            "app": "cantos-studio",
            "component": "studio-web",
            "requires": [
              "approve-cloudflare-studio-web"
            ],
            "context": [
              "cloudflare-web"
            ],
            "serial-group": "<< pipeline.project.slug >>/cloudflare-studio-web",
            "filters": "pipeline.git.branch == \"develop\" and (pipeline.git.repo_url == \"https://github.com/loveoverflowcom/cantos\" or pipeline.git.repo_url == \"https://github.com/loveoverflowcom/cantos.git\") and pipeline.config.ref == \"refs/heads/develop\" and (pipeline.config.repository.url == \"https://github.com/loveoverflowcom/cantos\" or pipeline.config.repository.url == \"https://github.com/loveoverflowcom/cantos.git\")"
          }
        }
      ]
    }
  }
}
