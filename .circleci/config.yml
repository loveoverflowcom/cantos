{
  "version": 2.1,
  "parameters": {
    "build": {
      "type": "boolean",
      "default": false,
      "description": "Build only; target must be empty. Conflicting inputs fail explicitly."
    },
    "build-component": {
      "type": "enum",
      "enum": [
        "api",
        "theatre-web",
        "studio-web",
        "android",
        "all"
      ],
      "default": "all",
      "description": "Explicit build component. Legacy api/all requests fail; native images use release oci-build."
    },
    "target": {
      "type": "string",
      "default": "",
      "description": "Opt-in release target merged into develop. Resolved exactly once. Live promotion refuses if develop subsequently moves."
    },
    "component": {
      "type": "enum",
      "enum": [
        "api",
        "theatre-web",
        "studio-web",
        "web",
        "all"
      ],
      "default": "api",
      "description": "Explicit Web component. Legacy api/all requests fail without production contexts."
    },
    "api-origin": {
      "type": "string",
      "default": "https://api.cantos.cc",
      "description": "Public exact HTTPS Web build input; participates in artifact identity."
    },
    "web-provider": {
      "type": "enum",
      "enum": [
        "firebase",
        "cloudflare"
      ],
      "default": "firebase",
      "description": "Which Web host receives theatre-web/studio-web. Cloudflare is opt-in and needs the cloudflare-web context."
    },
    "web-environment": {
      "type": "enum",
      "enum": [
        "preview",
        "production"
      ],
      "default": "preview",
      "description": "Cloudflare only: preview is a PUBLIC *.pages.dev URL; production replaces the project's live site."
    },
    "web-branch": {
      "type": "string",
      "default": "",
      "description": "Cloudflare only: Pages branch. Empty means the project's production branch for production; required for preview."
    }
  },
  "commands": {
    "install-build-rust": {
      "steps": [
        {
          "run": {
            "name": "Select repository Rust pin",
            "command": "set -Eeuo pipefail\nif ! command -v rustup >/dev/null; then\n  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/cantos-rustup.sh\n  sh /tmp/cantos-rustup.sh -y --profile minimal --default-toolchain none\nfi\nsource \"$HOME/.cargo/env\"\nrustup show active-toolchain\necho 'source \"$HOME/.cargo/env\"' >> \"$BASH_ENV\"\n"
          }
        }
      ]
    },
    "build-cache-restore": {
      "steps": [
        {
          "restore_cache": {
            "keys": [
              "v2-build-{{ arch }}-rust1981-{{ .Branch }}-{{ checksum \"Cargo.lock\" }}"
            ]
          }
        }
      ]
    },
    "build-cache-save": {
      "steps": [
        {
          "save_cache": {
            "key": "v2-build-{{ arch }}-rust1981-{{ .Branch }}-{{ checksum \"Cargo.lock\" }}",
            "paths": [
              "~/.cargo/registry",
              "~/.cargo/git"
            ]
          }
        }
      ]
    },
    "install-build-trunk": {
      "steps": [
        {
          "restore_cache": {
            "keys": [
              "v2-trunk-{{ arch }}-rust1981-02114"
            ]
          }
        },
        {
          "run": {
            "name": "Install pinned Trunk",
            "no_output_timeout": "30m",
            "command": "set -Eeuo pipefail\nif ! command -v trunk >/dev/null || [[ \"$(trunk --version)\" != \"trunk 0.21.14\" ]]; then\n  cargo install trunk --version 0.21.14 --locked --force\nfi\n"
          }
        },
        {
          "save_cache": {
            "key": "v2-trunk-{{ arch }}-rust1981-02114",
            "paths": [
              "~/.cargo/bin/trunk"
            ]
          }
        }
      ]
    },
    "release-checkout": {
      "steps": [
        {
          "attach_workspace": {
            "at": "."
          }
        },
        {
          "run": {
            "name": "Validate workspace provenance; checkout the single resolved SHA",
            "command": "cargo xtask release checkout --transfer artifacts/release-transfer"
          }
        }
      ]
    },
    "firebase-context": {
      "steps": [
        {
          "require-env": {
            "names": "FIREBASE_PROJECT FIREBASE_THEATRE_SITE FIREBASE_STUDIO_SITE FIREBASE_SERVICE_ACCOUNT_JSON"
          }
        },
        {
          "run": {
            "name": "Provide Firebase credentials and the site mapping outside Git",
            "command": "set -Eeuo pipefail\numask 077\ninstall -d -m 0700 ~/.config/cantos-ci\nprintf '%s' \"${FIREBASE_SERVICE_ACCOUNT_JSON}\" > ~/.config/cantos-ci/firebase-hosting.json\necho \"export GOOGLE_APPLICATION_CREDENTIALS=$HOME/.config/cantos-ci/firebase-hosting.json\" >> \"$BASH_ENV\"\n# infra/firebase/hosting/.firebaserc is ignored by Git; xtask reads it as strict JSON.\npython3 - \\<<'EOF'\nimport json, os\nmapping = {\"targets\": {os.environ[\"FIREBASE_PROJECT\"]: {\"hosting\": {\n    \"theatre\": [os.environ[\"FIREBASE_THEATRE_SITE\"]],\n    \"studio\": [os.environ[\"FIREBASE_STUDIO_SITE\"]]}}}}\nwith open(\"infra/firebase/hosting/.firebaserc\", \"w\") as handle:\n    json.dump(mapping, handle)\nEOF\n",
            "teardown": [
              {
                "run": {
                  "name": "Remove deployment credentials",
                  "command": "rm -rf ~/.config/cantos-ci"
                }
              }
            ]
          }
        }
      ]
    },
    "require-env": {
      "parameters": {
        "names": {
          "type": "string"
        }
      },
      "steps": [
        {
          "run": {
            "name": "Check required context variables",
            "environment": {
              "REQUIRED": "<< parameters.names >>"
            },
            "command": "set -Eeuo pipefail\nfor var in $REQUIRED; do\n  if [[ -z \"${!var:-}\" ]]; then\n    echo \"Missing production context variable: $var\" >&2\n    exit 1\n  fi\ndone\n"
          }
        }
      ]
    }
  },
  "jobs": {
    "reject-conflicting-request": {
      "machine": {
        "image": "ubuntu-2404:current"
      },
      "resource_class": "medium",
      "environment": {
        "CANTOS_PIPELINE_ID": "<< pipeline.id >>",
        "CANTOS_PIPELINE_NUMBER": "<< pipeline.number >>",
        "CANTOS_CONFIG_SHA": "<< pipeline.config.sha >>",
        "CANTOS_CONFIG_REPOSITORY": "<< pipeline.config.repository.url >>",
        "CANTOS_CONFIG_REF": "<< pipeline.config.ref >>"
      },
      "steps": [
        {
          "run": {
            "name": "Reject conflicting pipeline parameters",
            "command": "echo \"build=true requires an empty target; no release was started\" >&2\nexit 2"
          }
        }
      ]
    },
    "prepare-release": {
      "machine": {
        "image": "ubuntu-2404:current"
      },
      "resource_class": "medium",
      "environment": {
        "CANTOS_PIPELINE_ID": "<< pipeline.id >>",
        "CANTOS_PIPELINE_NUMBER": "<< pipeline.number >>",
        "CANTOS_CONFIG_SHA": "<< pipeline.config.sha >>",
        "CANTOS_CONFIG_REPOSITORY": "<< pipeline.config.repository.url >>",
        "CANTOS_CONFIG_REF": "<< pipeline.config.ref >>"
      },
      "parameters": {
        "component": {
          "type": "string"
        },
        "build-only": {
          "type": "boolean",
          "default": false
        },
        "android": {
          "type": "boolean",
          "default": false
        }
      },
      "steps": [
        "checkout",
        "install-build-rust",
        "build-cache-restore",
        {
          "when": {
            "condition": {
              "not": {
                "equal": [
                  "android",
                  "<< parameters.component >>"
                ]
              }
            },
            "steps": [
              {
                "run": {
                  "name": "Install offline API/Rust verification dependencies",
                  "command": "set -Eeuo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y -qq podman zstd ffmpeg\ncurl --proto '=https' --tlsv1.2 -fsSL https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz -o /tmp/cantos-node.tar.xz\necho 'df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/cantos-node.tar.xz' | sha256sum -c -\nmkdir -p \"$HOME/.local/cantos-node\"\ntar -xJf /tmp/cantos-node.tar.xz --strip-components=1 -C \"$HOME/.local/cantos-node\"\necho 'export PATH=\"$HOME/.local/cantos-node/bin:$PATH\"' >> \"$BASH_ENV\"\n"
                }
              },
              "install-build-trunk"
            ]
          }
        },
        {
          "when": {
            "condition": "<< parameters.android >>",
            "steps": [
              {
                "run": {
                  "name": "Select installed JDK 17 and verify existing SDK (no license acceptance)",
                  "command": "set -Eeuo pipefail\nexport JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64\ntest -x \"$JAVA_HOME/bin/javac\"\necho \"export JAVA_HOME=$JAVA_HOME\" >> \"$BASH_ENV\"\necho 'export PATH=\"$HOME/.local/cantos-gradle/gradle-8.14.3/bin:$JAVA_HOME/bin:$PATH\"' >> \"$BASH_ENV\"\ntest -f \"$ANDROID_HOME/platforms/android-35/android.jar\"\ntest -x \"$ANDROID_HOME/build-tools/35.0.0/aapt2\"\n"
                }
              },
              {
                "restore_cache": {
                  "keys": [
                    "v2-gradle-8143-{{ arch }}"
                  ]
                }
              },
              {
                "run": {
                  "name": "Install checksum-pinned Gradle distribution from official source",
                  "command": "set -Eeuo pipefail\nif [[ ! -x \"$HOME/.local/cantos-gradle/gradle-8.14.3/bin/gradle\" ]]; then\n  curl --proto '=https' --tlsv1.2 -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o /tmp/cantos-gradle.zip\n  echo 'bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531  /tmp/cantos-gradle.zip' | sha256sum -c -\n  mkdir -p \"$HOME/.local/cantos-gradle\"\n  unzip -q /tmp/cantos-gradle.zip -d \"$HOME/.local/cantos-gradle\"\nfi\n"
                }
              },
              {
                "save_cache": {
                  "key": "v2-gradle-8143-{{ arch }}",
                  "paths": [
                    "~/.local/cantos-gradle"
                  ]
                }
              },
              {
                "restore_cache": {
                  "keys": [
                    "v3-android-release-audit-{{ arch }}-gradle8143-{{ .Branch }}-{{ checksum \"apps/cantos-theatre/mobile/settings.gradle.kts\" }}-{{ checksum \"apps/cantos-theatre/mobile/androidApp/build.gradle.kts\" }}"
                  ]
                }
              }
            ]
          }
        },
        {
          "run": {
            "name": "Resolve once; affected gates; build immutable artifacts",
            "environment": {
              "RELEASE_COMPONENT": "<< parameters.component >>",
              "RELEASE_TARGET": "<< pipeline.parameters.target >>",
              "RELEASE_API_ORIGIN": "<< pipeline.parameters.api-origin >>",
              "BUILD_ONLY": "<< parameters.build-only >>"
            },
            "no_output_timeout": "30m",
            "command": "set -Eeuo pipefail\nargs=(--component \"$RELEASE_COMPONENT\" --api-origin \"$RELEASE_API_ORIGIN\" --transfer artifacts/release-transfer)\nif [[ \"$BUILD_ONLY\" == true ]]; then args+=(--build-only); fi\nif [[ -n \"$RELEASE_TARGET\" ]]; then args+=(--target \"$RELEASE_TARGET\"); fi\ncargo xtask release prepare \"${args[@]}\"\n"
          }
        },
        "build-cache-save",
        {
          "persist_to_workspace": {
            "root": ".",
            "paths": [
              "artifacts/release-transfer"
            ]
          }
        },
        {
          "store_artifacts": {
            "path": "artifacts/release-transfer"
          }
        }
      ]
    },
    "prepare-android": {
      "machine": {
        "image": "android:default"
      },
      "resource_class": "medium",
      "environment": {
        "CANTOS_PIPELINE_ID": "<< pipeline.id >>",
        "CANTOS_PIPELINE_NUMBER": "<< pipeline.number >>",
        "CANTOS_CONFIG_SHA": "<< pipeline.config.sha >>",
        "CANTOS_CONFIG_REPOSITORY": "<< pipeline.config.repository.url >>",
        "CANTOS_CONFIG_REF": "<< pipeline.config.ref >>"
      },
      "parameters": {
        "component": {
          "type": "string"
        },
        "build-only": {
          "type": "boolean",
          "default": false
        },
        "android": {
          "type": "boolean",
          "default": false
        }
      },
      "steps": [
        "checkout",
        "install-build-rust",
        "build-cache-restore",
        {
          "when": {
            "condition": {
              "not": {
                "equal": [
                  "android",
                  "<< parameters.component >>"
                ]
              }
            },
            "steps": [
              {
                "run": {
                  "name": "Install offline API/Rust verification dependencies",
                  "command": "set -Eeuo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y -qq podman zstd ffmpeg\ncurl --proto '=https' --tlsv1.2 -fsSL https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz -o /tmp/cantos-node.tar.xz\necho 'df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/cantos-node.tar.xz' | sha256sum -c -\nmkdir -p \"$HOME/.local/cantos-node\"\ntar -xJf /tmp/cantos-node.tar.xz --strip-components=1 -C \"$HOME/.local/cantos-node\"\necho 'export PATH=\"$HOME/.local/cantos-node/bin:$PATH\"' >> \"$BASH_ENV\"\n"
                }
              },
              "install-build-trunk"
            ]
          }
        },
        {
          "when": {
            "condition": "<< parameters.android >>",
            "steps": [
              {
                "run": {
                  "name": "Select installed JDK 17 and verify existing SDK (no license acceptance)",
                  "command": "set -Eeuo pipefail\nexport JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64\ntest -x \"$JAVA_HOME/bin/javac\"\necho \"export JAVA_HOME=$JAVA_HOME\" >> \"$BASH_ENV\"\necho 'export PATH=\"$HOME/.local/cantos-gradle/gradle-8.14.3/bin:$JAVA_HOME/bin:$PATH\"' >> \"$BASH_ENV\"\ntest -f \"$ANDROID_HOME/platforms/android-35/android.jar\"\ntest -x \"$ANDROID_HOME/build-tools/35.0.0/aapt2\"\n"
                }
              },
              {
                "restore_cache": {
                  "keys": [
                    "v2-gradle-8143-{{ arch }}"
                  ]
                }
              },
              {
                "run": {
                  "name": "Install checksum-pinned Gradle distribution from official source",
                  "command": "set -Eeuo pipefail\nif [[ ! -x \"$HOME/.local/cantos-gradle/gradle-8.14.3/bin/gradle\" ]]; then\n  curl --proto '=https' --tlsv1.2 -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o /tmp/cantos-gradle.zip\n  echo 'bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531  /tmp/cantos-gradle.zip' | sha256sum -c -\n  mkdir -p \"$HOME/.local/cantos-gradle\"\n  unzip -q /tmp/cantos-gradle.zip -d \"$HOME/.local/cantos-gradle\"\nfi\n"
                }
              },
              {
                "save_cache": {
                  "key": "v2-gradle-8143-{{ arch }}",
                  "paths": [
                    "~/.local/cantos-gradle"
                  ]
                }
              },
              {
                "restore_cache": {
                  "keys": [
                    "v3-android-release-audit-{{ arch }}-gradle8143-{{ .Branch }}-{{ checksum \"apps/cantos-theatre/mobile/settings.gradle.kts\" }}-{{ checksum \"apps/cantos-theatre/mobile/androidApp/build.gradle.kts\" }}"
                  ]
                }
              }
            ]
          }
        },
        {
          "run": {
            "name": "Resolve once; affected gates; build immutable artifacts",
            "environment": {
              "RELEASE_COMPONENT": "<< parameters.component >>",
              "RELEASE_TARGET": "<< pipeline.parameters.target >>",
              "RELEASE_API_ORIGIN": "<< pipeline.parameters.api-origin >>",
              "BUILD_ONLY": "<< parameters.build-only >>"
            },
            "no_output_timeout": "30m",
            "command": "set -Eeuo pipefail\nargs=(--component \"$RELEASE_COMPONENT\" --api-origin \"$RELEASE_API_ORIGIN\" --transfer artifacts/release-transfer)\nif [[ \"$BUILD_ONLY\" == true ]]; then args+=(--build-only); fi\nif [[ -n \"$RELEASE_TARGET\" ]]; then args+=(--target \"$RELEASE_TARGET\"); fi\ncargo xtask release prepare \"${args[@]}\"\n"
          }
        },
        "build-cache-save",
        {
          "persist_to_workspace": {
            "root": ".",
            "paths": [
              "artifacts/release-transfer"
            ]
          }
        },
        {
          "store_artifacts": {
            "path": "artifacts/release-transfer"
          }
        }
      ]
    },
    "deploy-theatre-web": {
      "machine": {
        "image": "ubuntu-2404:current"
      },
      "resource_class": "medium",
      "environment": {
        "CANTOS_PIPELINE_ID": "<< pipeline.id >>",
        "CANTOS_PIPELINE_NUMBER": "<< pipeline.number >>",
        "CANTOS_CONFIG_SHA": "<< pipeline.config.sha >>",
        "CANTOS_CONFIG_REPOSITORY": "<< pipeline.config.repository.url >>",
        "CANTOS_CONFIG_REF": "<< pipeline.config.ref >>"
      },
      "steps": [
        "checkout",
        "install-build-rust",
        "release-checkout",
        "firebase-context",
        {
          "run": {
            "name": "Install pinned publisher; no Trunk or wasm build tool",
            "command": "set -Eeuo pipefail\ncurl --proto '=https' --tlsv1.2 -fsSL https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz -o /tmp/cantos-node.tar.xz\necho 'df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/cantos-node.tar.xz' | sha256sum -c -\nmkdir -p \"$HOME/.local/cantos-node\"\ntar -xJf /tmp/cantos-node.tar.xz --strip-components=1 -C \"$HOME/.local/cantos-node\"\nexport PATH=\"$HOME/.local/cantos-node/bin:$PATH\"\nnpm install -g --prefix \"$HOME/.npm-global\" firebase-tools@15.34.0\necho 'export PATH=\"$HOME/.npm-global/bin:$HOME/.local/cantos-node/bin:$PATH\"' >> \"$BASH_ENV\"\n"
          }
        },
        {
          "run": {
            "name": "Bind intent to this job execution before any remote write",
            "command": "cargo xtask release intent --transfer artifacts/release-transfer --component theatre-web"
          }
        },
        {
          "persist_to_workspace": {
            "root": ".",
            "paths": [
              "artifacts/release-transfer/intents/theatre-web"
            ]
          }
        },
        {
          "run": {
            "name": "Promote exact theatre Web bytes; record remote identity and smoke",
            "command": "cargo xtask release promote --transfer artifacts/release-transfer --component theatre-web",
            "teardown": [
              {
                "run": {
                  "name": "Retain component outcome even on failure",
                  "command": "mkdir -p artifacts/release-transfer/outcomes/theatre-web"
                }
              },
              {
                "persist_to_workspace": {
                  "root": ".",
                  "paths": [
                    "artifacts/release-transfer/outcomes/theatre-web"
                  ]
                }
              }
            ]
          }
        },
        {
          "store_artifacts": {
            "path": "artifacts/release-transfer/outcomes/theatre-web"
          }
        }
      ]
    },
