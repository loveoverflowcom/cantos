[package]
name = "cantos-contracts"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[dependencies]
url = "=2.5.8"
prost = { version = "=0.13.5", default-features = false, features = ["derive", "std"] }
rmp = "=0.8.15"
rmp-serde = "=1.3.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
jsonschema = { version = "=0.33.0", default-features = false }
