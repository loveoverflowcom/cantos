[package]
name = "cantos-identity-rpc"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false
description = "Draft cantos.identity.v1 private RPC contract: prost messages and tonic client/server glue"

[dependencies]
# Exact pins, qualified in docs/evidence/identity-rpc-dependency-qualification.md. No default
# features: tonic's defaults enable gzip and TLS stacks that a UDS-only service never uses.
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
tonic = { version = "=0.14.5", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = { version = "=0.14.5", default-features = false }
