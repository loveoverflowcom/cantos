[package]
name = "cantos-ui"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[features]
default = []
csr = ["leptos/csr"]
preview = ["csr"]

[[bin]]
name = "ui-foundation-preview"
path = "preview/main.rs"
required-features = ["preview"]

[dependencies]
leptos = { version = "=0.7.8", default-features = false }

# Browser-owned intrinsic geometry for interruptible auth capsule feedback.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.77", features = ["ResizeObserver", "DomRect", "CssStyleDeclaration"] }

# Native tests render component anatomy to strings; browser bundles stay CSR-only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { version = "=0.7.8", default-features = false, features = ["ssr"] }
