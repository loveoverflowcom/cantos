[package]
name = "cantos-web-auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
url = "=2.5.8"
futures-util = "=0.3.34"
uuid = { version = "=1.18.1", default-features = false, features = ["std"] }

[dev-dependencies]
jsonschema = { version = "=0.33.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "=0.6.0", features = ["http"] }
web-sys = { version = "=0.3.77", features = ["Window", "Performance", "AbortController", "AbortSignal", "Event", "EventTarget", "RequestCredentials", "RequestRedirect", "BroadcastChannel", "MessageEvent", "Navigator"] }
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"
