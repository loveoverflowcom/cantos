[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false
description = "Repository-level build, run and verification surface for Cantos (cargo xtask)"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
# Reuse locked parsers/digests; validation runs without any container runtime.
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
sha2 = "=0.10.9"
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
signal-hook = "=0.3.18"
