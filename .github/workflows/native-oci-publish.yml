name: Native OCI publish

# Manual producer for the native Server/Identity image pair (#348). It builds the checked-out
# commit, pushes both images to GHCR and records an UNADMITTED candidate: every qualification gate
# is initially NOT_RUN. The disposable Linux qualification step tests that exact published pair
# and retains a separate result; an operator admission is still required. No deployment occurs.
# The same release owner (`scripts/release_oci_build.py`) serves the local producer.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-oci-publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest # linux/amd64, the VPS platform; a different platform needs its own review
    # Only the publish job holds package write access.
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # historical v24 registry is independently checked at its pinned source
      - name: Select pinned Rust toolchain for xtask
        run: rustup show active-toolchain # installs the exact rust-toolchain.toml pin
      - name: Build the static source-pinned deployment executor
        run: |
          set -Eeuo pipefail
          # Disposable builder only: no compiler installation or containerized host execution on a VPS.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl --toolchain 1.98.1
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/cantos-native-executor
          cargo xtask release native-executor-build --output artifacts/native-executor
          # Root's historical rehearsal uses this exact immutable checkout, not the builder's cwd.
          sudo chown -R root:root "/opt/cantos-native-executor/$GITHUB_SHA"
      - name: Log in to GHCR with a job-scoped authfile
        env:
          GITHUB_TOKEN_VALUE: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          umask 077
          # The token goes through stdin to a private file; it is never on a command line or in a log.
          printf '%s' "$GITHUB_TOKEN_VALUE" | podman login ghcr.io --username "$ACTOR" --password-stdin \
            --authfile "$RUNNER_TEMP/ghcr-auth.json"
      - name: Build, publish and read back the pair
        run: |
          set -Eeuo pipefail
          cargo xtask release oci-build --platform linux/amd64 --producer github-actions \
            --publish --authfile "$RUNNER_TEMP/ghcr-auth.json" | tee "$RUNNER_TEMP/oci-build-result.json"
      - name: Build separate stopped-database sample operator
        run: |
          set -Eeuo pipefail
          # The operator is extracted from the pinned build stage; it is not in the Server image.
          if python3 scripts/release_sample_operator_build.py --output "$GITHUB_WORKSPACE/artifacts/sample-operator" \
              > "$RUNNER_TEMP/sample-operator-build-status.json"; then
            cat "$RUNNER_TEMP/sample-operator-build-status.json"
          else
            printf '%s\n' '{"status":"FAIL","admission":"NOT_RUN","activation":"NOT_RUN"}' \
              > "$RUNNER_TEMP/sample-operator-build-status.json"
          fi
      - name: Probe disposable systemd and Quadlet prerequisites
        run: |
          set -Eeuo pipefail
          # Rootful Podman info can initialize runner storage. Probe after the rootless
          # build, and never treat prerequisites as executor or activation evidence.
          if sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT:-unknown}" \
              python3 scripts/release_native_executor_probe.py > "$RUNNER_TEMP/native-systemd-prerequisites.json"; then
            cat "$RUNNER_TEMP/native-systemd-prerequisites.json"
          else
            printf '%s\n' '{"status":"NOT_RUN","executor_transition":"NOT_RUN","activation":"NOT_RUN"}' \
              > "$RUNNER_TEMP/native-systemd-prerequisites.json"
          fi
      - name: Pin the one published candidate from this run
        id: candidate
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          paths = list(Path('artifacts/release-build/oci').glob('**/candidate/manifest.json'))
          assert len(paths) == 1, 'exactly one producer candidate required'
          path = paths[0]
          raw = path.read_bytes()
          manifest = json.loads(raw)
          assert manifest['source_sha'] == os.environ['SOURCE_SHA']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'manifest={path}\n')
              output.write(f'digest={hashlib.sha256(raw).hexdigest()}\n')
              output.write(f'configuration={manifest["configuration_sha256"]}\n')
          PY
      - name: Qualify the exact pair on disposable native Linux
        env:
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          MANIFEST_DIGEST: ${{ steps.candidate.outputs.digest }}
          CONFIGURATION: ${{ steps.candidate.outputs.configuration }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          # Root is confined to this disposable runner and its private Podman image store.
          # No production credentials, remote host, systemd/Quadlet or admission are involved.
          sudo install -m 0600 "$RUNNER_TEMP/ghcr-auth.json" "$RUNNER_TEMP/qualification-auth.json"
          trap 'sudo rm -f "$RUNNER_TEMP/qualification-auth.json"' EXIT
          sudo env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" \
            cargo xtask release oci-qualify \
            --manifest "$MANIFEST" --manifest-digest "$MANIFEST_DIGEST" \
            --source-sha "$SOURCE_SHA" --configuration-digest "$CONFIGURATION" --platform linux/amd64 \
            --authfile "$RUNNER_TEMP/qualification-auth.json" \
            --output artifacts/release-qualification/exact-pair
      - name: Rehearse historical v24 to v27 and cold pair recovery
        env:
          CONFIGURATION: ${{ steps.candidate.outputs.configuration }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          sudo install -m 0600 "$RUNNER_TEMP/ghcr-auth.json" "$RUNNER_TEMP/historical-auth.json"
          trap 'sudo rm -f "$RUNNER_TEMP/historical-auth.json"' EXIT
          # Bind the rehearsal to the qualified manifest that an operator can admit,
          # not the pre-qualification candidate with different evidence bytes.
          MANIFEST=artifacts/release-qualification/exact-pair/manifest.json
          MANIFEST_DIGEST=$(sudo sha256sum "$MANIFEST" | cut -d' ' -f1)
          BASELINE_DIGEST=$(sha256sum infra/oci/historical-v24.json | cut -d' ' -f1)
          sudo "/opt/cantos-native-executor/$SOURCE_SHA/target/x86_64-unknown-linux-musl/release/xtask" \
            release native-rehearse \
            --manifest "$GITHUB_WORKSPACE/$MANIFEST" --manifest-digest "$MANIFEST_DIGEST" \
            --source-sha "$SOURCE_SHA" --configuration-digest "$CONFIGURATION" --platform linux/amd64 \
            --baseline infra/oci/historical-v24.json --baseline-digest "$BASELINE_DIGEST" \
            --transition v24-v27 \
            --authfile "$RUNNER_TEMP/historical-auth.json" \
            --output "$GITHUB_WORKSPACE/artifacts/release-qualification/historical-v24-v27"
      - name: Rehearse second pinned v24 pair to v27 and cold pair recovery
        env:
          CONFIGURATION: ${{ steps.candidate.outputs.configuration }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          sudo install -m 0600 "$RUNNER_TEMP/ghcr-auth.json" "$RUNNER_TEMP/historical-auth.json"
          trap 'sudo rm -f "$RUNNER_TEMP/historical-auth.json"' EXIT
          MANIFEST=artifacts/release-qualification/exact-pair/manifest.json
          MANIFEST_DIGEST=$(sudo sha256sum "$MANIFEST" | cut -d' ' -f1)
          BASELINE_DIGEST=$(sha256sum infra/oci/historical-v24-8862.json | cut -d' ' -f1)
          sudo "/opt/cantos-native-executor/$SOURCE_SHA/target/x86_64-unknown-linux-musl/release/xtask" \
            release native-rehearse \
            --manifest "$GITHUB_WORKSPACE/$MANIFEST" --manifest-digest "$MANIFEST_DIGEST" \
            --source-sha "$SOURCE_SHA" --configuration-digest "$CONFIGURATION" --platform linux/amd64 \
            --baseline infra/oci/historical-v24-8862.json --baseline-digest "$BASELINE_DIGEST" \
            --transition v24-v27 \
            --authfile "$RUNNER_TEMP/historical-auth.json" \
            --output "$GITHUB_WORKSPACE/artifacts/release-qualification/historical-v24-8862-v27"
      - name: Qualify separate sample operator against the exact pair
        env:
          CONFIGURATION: ${{ steps.candidate.outputs.configuration }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          OUTPUT="$RUNNER_TEMP/sample-operator-qualification-status.json"
          if ! test -f artifacts/sample-operator/operator-build.json || ! test -f artifacts/sample-operator/cantos-operator; then
            printf '%s\n' '{"status":"NOT_RUN","admission":"NOT_RUN","activation":"NOT_RUN"}' > "$OUTPUT"
          else
            MANIFEST=artifacts/release-qualification/exact-pair/manifest.json
            MANIFEST_DIGEST=$(sudo sha256sum "$MANIFEST" | cut -d' ' -f1)
            BUILD_DIGEST=$(sha256sum artifacts/sample-operator/operator-build.json | cut -d' ' -f1)
            sudo install -m 0600 "$RUNNER_TEMP/ghcr-auth.json" "$RUNNER_TEMP/sample-operator-auth.json"
            trap 'sudo rm -f "$RUNNER_TEMP/sample-operator-auth.json"' EXIT
            if sudo python3 "/opt/cantos-native-executor/$SOURCE_SHA/scripts/release_sample_operator_qualify.py" \
                --manifest "$GITHUB_WORKSPACE/$MANIFEST" --manifest-digest "$MANIFEST_DIGEST" \
                --source-sha "$SOURCE_SHA" --configuration-digest "$CONFIGURATION" --platform linux/amd64 \
                --binary "$GITHUB_WORKSPACE/artifacts/sample-operator/cantos-operator" \
                --build-record "$GITHUB_WORKSPACE/artifacts/sample-operator/operator-build.json" \
                --build-record-digest "$BUILD_DIGEST" --authfile "$RUNNER_TEMP/sample-operator-auth.json" \
                --output "$GITHUB_WORKSPACE/artifacts/release-qualification/sample-operator" > "$OUTPUT"; then
              cat "$OUTPUT"
            else
              printf '%s\n' '{"status":"FAIL","admission":"NOT_RUN","activation":"NOT_RUN"}' > "$OUTPUT"
            fi
          fi
      - name: Rehearse disposable systemd executor transitions
        env:
          CONFIGURATION: ${{ steps.candidate.outputs.configuration }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          # Results are separate from image qualification and never grant admission.
          OUTPUT="$RUNNER_TEMP/native-executor-rehearsal-status.json"
          if ! jq -e '.status == "PREREQUISITES_ONLY"' "$RUNNER_TEMP/native-systemd-prerequisites.json" > /dev/null; then
            printf '%s\n' '{"status":"NOT_RUN","executor_transition":"NOT_RUN","activation":"NOT_RUN"}' > "$OUTPUT"
          else
            MANIFEST=artifacts/release-qualification/exact-pair/manifest.json
            MANIFEST_DIGEST=$(sudo sha256sum "$MANIFEST" | cut -d' ' -f1)
            sudo install -m 0600 "$RUNNER_TEMP/ghcr-auth.json" "$RUNNER_TEMP/systemd-fixture-auth.json"
            trap 'sudo rm -f "$RUNNER_TEMP/systemd-fixture-auth.json"' EXIT
            if sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT:-unknown}" \
                python3 "/opt/cantos-native-executor/$SOURCE_SHA/scripts/release_native_executor_rehearsal.py" \
                --manifest "$GITHUB_WORKSPACE/$MANIFEST" --manifest-digest "$MANIFEST_DIGEST" \
                --source-sha "$SOURCE_SHA" --configuration-digest "$CONFIGURATION" --platform linux/amd64 \
                --authfile "$RUNNER_TEMP/systemd-fixture-auth.json" \
                --historical "$GITHUB_WORKSPACE/artifacts/release-qualification/historical-v24-8862-v27/historical-upgrade.json" \
                --output "$GITHUB_WORKSPACE/artifacts/release-qualification/executor-rehearsal" > "$OUTPUT"; then
              cat "$OUTPUT"
            else
              printf '%s\n' '{"status":"FAIL","executor_transition":"NOT_RUN","activation":"NOT_RUN"}' > "$OUTPUT"
            fi
          fi
      - name: Make only this run's qualification receipts readable for artifact retention
        if: always()
        run: |
          if test -d artifacts/release-qualification; then
            sudo chown -R -- "$(id -u):$(id -g)" artifacts/release-qualification
          fi
      - name: Remove the authfile
        if: always()
        run: rm -f "$RUNNER_TEMP/ghcr-auth.json"
      - name: Keep candidate and interrupted publication records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-oci-candidate-${{ github.sha }}
          path: |
            artifacts/release-build/oci/
            artifacts/release-qualification/
            artifacts/native-executor/
            artifacts/sample-operator/
            ${{ runner.temp }}/oci-build-result.json
            ${{ runner.temp }}/native-systemd-prerequisites.json
            ${{ runner.temp }}/native-executor-rehearsal-status.json
            ${{ runner.temp }}/sample-operator-build-status.json
            ${{ runner.temp }}/sample-operator-qualification-status.json
          if-no-files-found: error
          retention-days: 14
