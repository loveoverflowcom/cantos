name: Repository checks

# Each job only provisions its environment (toolchain, Trunk and media tools) and then runs one
# job of the shared `cargo xtask ci` contract; explicit qualification jobs call their xtask owner.
# xtask owns what is verified. No job provisions a
# database or another service: the Server and Identity persist in embedded files owned by the
# test process itself.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      native_auth_qualification:
        description: Also run the manual #336 native auth Linux qualification campaign (with Kani)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Manual feature-branch dispatch needs origin/develop and its shared ancestry.
          fetch-depth: 0
      - name: Select pinned Rust toolchain for xtask
        run: rustup show active-toolchain # installs the exact rust-toolchain.toml pin and components
      - name: Documents, fixtures, skills and the Script IR oracle
        run: cargo xtask ci --job repository
  rust:
    runs-on: ubuntu-latest
    # The uncached full suite exceeded 20 minutes on the hosted runner while still making progress.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain # installs the exact rust-toolchain.toml pin and components
      - name: Select Node 22 for offline Forge Functions wrapper tests
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install read-only inspection and owned-fixture test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg pkg-config libdav1d-dev
      - name: Format, lint, test, offline Forge wrapper and actual media inspection
        run: cargo xtask ci --job rust
  forge-probe-linux:
    # Independent test-only lane: broad workspace failures cannot hide #486's package proof.
    # No environment, cloud credentials, publisher or privileged pull_request_target event.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      npm_config_registry: https://registry.npmjs.org
    steps:
      - name: Check out the exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Provision the pinned Linux musl target and linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools=1.2.4-2
          rustup target add x86_64-unknown-linux-musl --toolchain 1.98.1
      - name: Select pinned Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Build and qualify only the disposable Forge probe package
        run: |
          cargo xtask forge-probe self-test
          cargo xtask forge-probe package --project cantos-a348b --region asia-southeast1 --output artifacts/forge-probe/ci-linux
          cargo xtask forge-probe inspect --bundle artifacts/forge-probe/ci-linux
          cargo xtask forge-probe qualify --bundle artifacts/forge-probe/ci-linux
      - name: Retain the successful test package integrity receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-probe-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/forge-probe/ci-linux/receipt.json
          if-no-files-found: error
          retention-days: 14
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain with the WASM target
        run: rustup show active-toolchain # installs the exact rust-toolchain.toml pin and components
      - name: Install the documented Trunk version
        run: cargo install trunk --version 0.21.14 --locked
      - name: WASM lint and Trunk builds of Studio and Theatre Web
        run: cargo xtask ci --job web
  native-auth-qualification:
    # Manual only (#336): dispatch on the candidate ref with native_auth_qualification=true. It
    # provisions pinned tools, then xtask owns every check; nothing here is a verifier.
    if: github.event_name == 'workflow_dispatch' && inputs.native_auth_qualification
    runs-on: ubuntu-24.04 # D1: GitHub Actions Ubuntu x86_64
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain # installs the exact rust-toolchain.toml pin and components
      - name: Select the pinned Node for the locked Quint tool
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Select the pinned npm and install the locked Quint tool
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.9.0
          cargo xtask verify behavior --setup --capability cantos.identity.native-mailbox-proof
      - name: Install the pinned Kani 0.68.0 bundle
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Allow the isolation guard's unprivileged user and network namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install native Media decoder headers
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libdav1d-dev
      - name: Native auth Linux qualification, isolation and Kani
        run: cargo xtask verify native-auth-qualification --kani --report "$RUNNER_TEMP/native-auth-qualification.json"
      - name: Retain the sanitized report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-auth-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/native-auth-qualification.json
          if-no-files-found: warn
          retention-days: 30
