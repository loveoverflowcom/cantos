name: Repository checks

# Each job only provisions its environment (toolchain, Trunk, PostgreSQL binaries) and then
# runs one job of the shared `cargo xtask ci` contract; xtask owns what is verified.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.87.0

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain for xtask
        run: rustup toolchain install 1.87.0 --profile minimal
      - name: Documents, fixtures, skills and the Script IR oracle
        run: cargo xtask ci --job repository
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: rustup toolchain install 1.87.0 --profile minimal --component rustfmt --component clippy
      - name: Format, lint, test and the WAV oracle
        run: cargo xtask ci --job rust
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain with the WASM target
        run: rustup toolchain install 1.87.0 --profile minimal --component clippy --target wasm32-unknown-unknown
      - name: Install the documented Trunk version
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo install trunk --version 0.21.14 --locked
      - name: WASM lint and Trunk builds of Studio and Theatre Web
        run: cargo xtask ci --job web
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: rustup toolchain install 1.87.0 --profile minimal
      - name: Install PostgreSQL 17 server binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Disposable-cluster migrations, persistence, restart and recovery tests
        run: cargo xtask ci --job postgres
