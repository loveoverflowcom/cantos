[package]
name = "cantos-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[dependencies]
axum = "=0.8.4"
base64 = "=0.22.1"
cantos-contracts = { path = "../../packages/contracts/api" }
deadpool-postgres = "=0.14.1"
getrandom = "=0.3.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
sha2 = "=0.10.9"
unicode-normalization = "=0.1.24"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tokio-postgres = "=0.7.15"
tower-http = { version = "=0.6.6", features = ["fs"] }
uuid = { version = "=1.18.1", features = ["v4"] }
quick-xml = "=0.38.4"
reqwest = { version = "=0.12.15", default-features = false, features = ["rustls-tls"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[dev-dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
jsonschema = { version = "=0.33.0", default-features = false }
tower = { version = "=0.5.2", features = ["util"] }
http-body-util = "=0.1.3"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[[bin]]
name = "validate-script"
path = "src/bin/validate-script.rs"
