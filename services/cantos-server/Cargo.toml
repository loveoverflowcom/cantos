[package]
name = "cantos-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[features]
# File-backed `server.db` fixtures (`test_support`) for integration tests: run-owned temp
# directories, fixed or system clocks and fixture SQL. Never enabled in a runtime build; the
# self dev-dependency below turns it on for this package's own tests only.
test-support = ["cantos-store-turso/testing"]

[dependencies]
axum = "=0.8.4"
bytes = "=1.12.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
hmac = "=0.12.1"
reqwest = { version = "=0.12.15", default-features = false, features = ["rustls-tls", "stream"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
url = "=2.5.8"
tokio-util = { version = "=0.7.19", features = ["io"] }
cantos-store-turso = { path = "../../packages/store-turso" }
futures-util = "=0.3.34"
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
getrandom = "=0.3.4"
image = { version = "=0.25.8", default-features = false }
dav1d = "=0.11.1"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
sha2 = "=0.10.9"
ring = "=0.17.14"
base64 = "=0.22.1"
unicode-normalization = "=0.1.24"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync", "fs", "io-util"] }
tonic = { version = "=0.14.5", default-features = false, features = ["transport", "codegen"] }
tower = { version = "=0.5.2", default-features = false, features = ["util"] }
tower-http = { version = "=0.6.6", features = ["fs"] }
uuid = { version = "=1.18.1", features = ["v4"] }
quick-xml = "=0.38.4"
# Wire representations of the Server's own contracts (`src/contract`) and of its Identity RPC
# client: prost messages generated by `tools/proto-codegen`, MessagePack for the legacy codec.
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
rmp = "=0.8.15"
rmp-serde = "=1.3.1"
tonic-prost = { version = "=0.14.5", default-features = false }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[dev-dependencies]
# Only the real-Identity HTTP test mutates its stopped, run-owned identity.db.
cantos-identity = { path = "../cantos-identity", features = ["persistence"] }
cantos-server = { path = ".", features = ["test-support"] }
# Run-owned directories and a fixed clock for every file-backed `server.db` test.
cantos-store-turso = { path = "../../packages/store-turso", features = ["testing"] }
tokio = { version = "=1.47.1", features = ["process"] }
tokio-stream = { version = "=0.1.19", default-features = false, features = ["net"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
jsonschema = { version = "=0.33.0", default-features = false }
http-body-util = "=0.1.3"
# The scripted Identity peer (`tests/support/fake_identity.rs`) serves its own generated server.
tonic = { version = "=0.14.5", default-features = false, features = ["transport", "codegen", "router"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[[bin]]
name = "validate-script"
path = "src/bin/validate-script.rs"

[lints.rust]
# Kani injects its crate only for cfg(kani); ordinary Rust/WASM builds retain no proof dependency.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
