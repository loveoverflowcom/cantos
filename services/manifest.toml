# Process inventory, schema 1. No credentials or host-specific paths belong here.
# A service is a runnable native process or independently managed infrastructure. Each native
# process owns exactly one embedded Turso file; nothing here is a database server.
version = 1

[services.cantos-server]
runtime = "native"
implementation = "implemented"
owner = "Cantos backend maintainers"
required_dependencies = []
optional_dependencies = ["cantos-identity", "object-storage"]
development = "cargo xtask run owns the Server beside cantos-identity: migrate server.db explicitly, then serve 127.0.0.1:8080 for Studio and Theatre; no database server, container or provider issuer"
production = "Native OCI image under Podman Quadlet, pinned by GHCR digest (docs/deployment/native-oci-release.md); no release has been admitted and no host activated from source"
environment = ["CANTOS_ENV", "CANTOS_BIND_ADDRESS", "CANTOS_STUDIO_WEB_ORIGIN", "CANTOS_THEATRE_WEB_ORIGIN", "CANTOS_ADMIN_WEB_ORIGIN", "CANTOS_SERVER_DATABASE", "CANTOS_IDENTITY_SOCKET", "CANTOS_IDENTITY_PEER_UID", "CANTOS_IDENTITY_PEER_POLICY", "CANTOS_IDENTITY_TRUSTED_PROXIES", "CANTOS_IDENTITY_STUDIO_SUBJECTS", "CANTOS_AUDIO_ROOT", "CANTOS_STORAGE_CONFIG", "CANTOS_PUBLICATION_ROOT", "CANTOS_PLAYBACK_KEY_FILE", "CANTOS_PUBLIC_MEDIA_ORIGIN"]
ports = [8080]
health = "Native run checks TCP readiness and the anonymous Theatre catalog route; no Identity session or publication readiness implied"
persistence = "One embedded Turso file, server.db, owned exclusively by this process; cantos-migrate is the only creator or upgrader and serving refuses a missing, foreign or unmigrated file; explicit private audio storage"
lifecycle = "cargo xtask run owns only the foreground process groups it starts; cantos-operator needs the Server stopped because the file has one owner"

[services.cantos-identity]
runtime = "native"
implementation = "implemented"
owner = "Cantos identity maintainers"
required_dependencies = []
optional_dependencies = []
development = "cargo xtask run starts it beside the Server with identity.db and a private Unix socket; local mail is disabled and inherited Google/Firebase/SMTP inputs are refused. Theatre Web run also owns a disposable Auth Emulator; the native proof bridge is not implemented"
production = "Native OCI image under Podman Quadlet beside the Server; separate UID, separate database directory, private socket directory shared by group (infra/vps/quadlet); not accepted on a host"
environment = ["CANTOS_IDENTITY_DATABASE", "CANTOS_IDENTITY_SOCKET", "CANTOS_IDENTITY_SOCKET_MODE", "CANTOS_IDENTITY_SERVER_UIDS", "CANTOS_IDENTITY_SIGNUP_LINK_BASE", "CANTOS_IDENTITY_MAIL_PROVIDER", "CANTOS_IDENTITY_LOCAL_DEVELOPMENT", "CANTOS_IDENTITY_SMTP_HOST", "CANTOS_IDENTITY_SMTP_PORT", "CANTOS_IDENTITY_SMTP_TLS", "CANTOS_IDENTITY_SMTP_FROM", "CANTOS_IDENTITY_SMTP_USERNAME", "CANTOS_IDENTITY_SMTP_PASSWORD"]
ports = []
health = "Native run connects to the Unix socket once; that observes a listening process, not an authentication"
persistence = "One embedded Turso file, identity.db, owned exclusively by this process; cantos-identity migrate is explicit and serve never creates or migrates"
lifecycle = "cargo xtask run owns only the process group it starts; the socket inode of a stopped run is replaced only by Identity itself"

[services.object-storage]
runtime = "external"
implementation = "configured"
owner = "Cantos storage operator"
required_dependencies = []
optional_dependencies = []
development = "Private filesystem or explicitly configured S3 adapter; no object-store service provisioned"
production = "Private-only S3 transport implemented; provider acceptance and publication isolation deferred"
environment = []
ports = []
health = "Startup validates config only; HEAD/GET/Range acceptance requires authorized operator tests"
persistence = "Externally managed media; no lifecycle or deletion command"
lifecycle = "Operator-managed; xtask reports external services as unobserved"
