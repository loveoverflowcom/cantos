[package]
name = "cantos-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
axum = "=0.8.9"
chrono = { version = "=0.4.45", features = ["serde"] }
rand = "=0.8.8"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
unicode-normalization = "=0.1.24"
uuid = { version = "=1.27.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "=0.1.5"
jsonschema = { version = "=0.33.0", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
tower = { version = "=0.5.3", features = ["util"] }

[[bin]]
name = "validate-script"
path = "src/bin/validate-script.rs"
