[package]
name = "cantos-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[features]
default = []
# Explicit pilot opt-in while ADR 0023 activation acceptance remains incomplete.
revision-protobuf = []

[dependencies]
cantos-contracts = { path = "../../../packages/contracts/api" }
serde_json = "=1.0.145"
serde = "=1.0.228"
cantos-ui = { path = "../../../packages/ui-system/leptos" }
leptos = { version = "=0.7.8", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cantos-ui = { path = "../../../packages/ui-system/leptos", features = ["csr"] }
leptos = { version = "=0.7.8", features = ["csr"] }
gloo-net = { version = "=0.6.0", features = ["http"] }
web-sys = { version = "=0.3.77", features = ["Crypto", "Window", "Location", "File", "FileList", "Blob", "HtmlInputElement", "HtmlTextAreaElement", "HtmlElement", "Document", "Element", "EventTarget", "CompositionEvent", "BeforeUnloadEvent", "AbortController", "AbortSignal", "RequestCredentials", "SubtleCrypto", "Navigator", "Clipboard"] }
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { version = "=0.7.8", default-features = false, features = ["ssr"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
