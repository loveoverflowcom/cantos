[package]
name = "cantos-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[features]
default = []
# Explicit pilot opt-in while ADR 0023 activation acceptance remains incomplete.
revision-protobuf = []

[dependencies]
cantos-web-auth = { path = "../../../packages/web-auth" }
serde_json = "=1.0.145"
serde = { version = "=1.0.228", features = ["derive"] }
# Studio Web's own wire representations: MessagePack and the editorial Protobuf pilot binding
# generated from the Server-owned proto by `tools/proto-codegen`.
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
rmp = "=0.8.15"
rmp-serde = "=1.3.1"
cantos-ui = { path = "../../../packages/ui-system/leptos" }
leptos = { version = "=0.7.8", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cantos-ui = { path = "../../../packages/ui-system/leptos", features = ["csr"] }
leptos = { version = "=0.7.8", features = ["csr"] }
gloo-net = { version = "=0.6.0", features = ["http"] }
web-sys = { version = "=0.3.77", features = ["Crypto", "Window", "Location", "File", "FileList", "Blob", "HtmlInputElement", "HtmlTextAreaElement", "HtmlElement", "Document", "Element", "EventTarget", "CompositionEvent", "BeforeUnloadEvent", "AbortController", "AbortSignal", "RequestCredentials", "RequestRedirect", "History", "HtmlAnchorElement", "SubtleCrypto", "Navigator", "Clipboard", "Url", "HtmlImageElement", "XmlHttpRequest", "XmlHttpRequestUpload", "XmlHttpRequestEventTarget", "XmlHttpRequestResponseType", "ProgressEvent"] }
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { version = "=0.7.8", default-features = false, features = ["ssr"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
