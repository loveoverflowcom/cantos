[build]
target = "index.html"

[serve]
addresses = ["127.0.0.1"]
port = 8082

# Same-origin development transport reaches only the real API; no mock fallback. Identity v1
# answers JSON and sets its own host-only HttpOnly cookie; the proxy never follows redirects.
[[proxy]]
backend = "http://127.0.0.1:8080/api/"
rewrite = "/api/"
no_redirect = true
