[build]
target = "index.html"

[serve]
addresses = ["127.0.0.1"]
port = 8082

# Same-origin development transport reaches only the real API; no mock fallback. Identity v1
# answers JSON and sets its own host-only HttpOnly cookie; the proxy never follows redirects.
[[proxy]]
backend = "http://127.0.0.1:8080/api/"
rewrite = "/api/"
no_redirect = true

# ADR 0048: the signup email action handler is `https://<origin>/verify-email`. Pages serves
# `verify-email.html` at that exact path (no rewrite or redirect), so the processed entry page is
# copied byte for byte after Trunk writes it. `deploy` refuses the copy unless it equals
# `index.html`; `trunk serve` reaches the same entry through its fallback.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "cp \"$TRUNK_STAGING_DIR/index.html\" \"$TRUNK_STAGING_DIR/verify-email.html\""]
