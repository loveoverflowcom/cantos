[package]
name = "cantos-theatre"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[features]
# Isolated development previews (`?mode=mock`, `?mode=auth-preview`, `?mode=membership-preview`):
# sample catalog, fake player and diagnostic fixtures. Off by default, so a production bundle
# neither compiles nor routes to them. Opt in with `--features preview` on a development build;
# `cargo xtask` enables it for tests and lint; development builds use TRUNK_BUILD_FEATURES=preview.
preview = []

[dependencies]
cantos-localization = { path = "../../../packages/localization/rust" }
cantos-web-auth = { path = "../../../packages/web-auth" }
uuid = { version = "=1.18.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
url = "=2.5.8"
cantos-ui = { path = "../../../packages/ui-system/leptos" }
leptos = { version = "=0.7.8", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.7.8", features = ["csr"] }
gloo-net = { version = "=0.6.0", features = ["http"] }
web-sys = { version = "=0.3.77", features = ["VisualViewport", "Window", "Location", "HtmlElement", "Document", "AbortController", "AbortSignal", "RequestCredentials", "RequestRedirect", "History", "Storage", "PageTransitionEvent", "HashChangeEvent", "KeyboardEvent", "Crypto", "ResizeObserver", "CssStyleDeclaration", "DomRect", "HtmlAudioElement", "HtmlMediaElement", "MediaError", "Event", "DomException", "FocusEvent", "MouseEvent", "Node"] }
cantos-ui = { path = "../../../packages/ui-system/leptos", features = ["csr"] }


[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { version = "=0.7.8", default-features = false, features = ["ssr"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
