[package]
name = "cantos-theatre"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[dependencies]
uuid = { version = "=1.18.1", default-features = false, features = ["std"] }
cantos-contracts = { path = "../../../packages/contracts/api" }
serde_json = "=1.0.145"
cantos-ui = { path = "../../../packages/ui-system/leptos" }
leptos = { version = "=0.7.8", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.7.8", features = ["csr"] }
gloo-net = { version = "=0.6.0", features = ["http"] }
web-sys = { version = "=0.3.77", features = ["Window", "Location", "HtmlElement", "Document", "AbortController", "AbortSignal", "RequestCredentials", "History", "Storage", "PageTransitionEvent", "KeyboardEvent", "Crypto", "ResizeObserver", "CssStyleDeclaration", "DomRect"] }
cantos-ui = { path = "../../../packages/ui-system/leptos", features = ["csr"] }


[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { version = "=0.7.8", default-features = false, features = ["ssr"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
